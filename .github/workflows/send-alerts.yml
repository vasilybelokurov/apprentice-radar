# Weekly alert: opens a GitHub issue, assigned to the owner, listing new vacancies that match
# alerts.json. GitHub emails the assignee. Reads the published vacancies.json; needs no secrets.
#
# Change the cadence by editing the cron line (e.g. "23 7 * * 1,4" for Monday and Thursday).
name: Send alerts

on:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23, after the daily 05:17 sync
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Send alert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run alerts
